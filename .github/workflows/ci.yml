name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [22, 24]   # the sources run as they are: Node's built-in TypeScript stripping, 22.18 or later
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: node --version
      - run: npm test
      - name: The command line works from a clone, with nothing installed
        run: |
          mkdir work && cd work
          node ../src/cli.ts help
          node ../src/cli.ts keygen --out keys
          sed 's/swdr_REPLACE_WITH_DRILL_ID/swdr_AAAAAAAAAAAAAAAAAAAA/' ../sample/scope.example.json > scope.json
          node ../src/cli.ts sign --scope scope.json --key keys/drill-private.pem
          node ../src/cli.ts check --scope scope.signed.json

  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t overwing-drill .
      - name: The image runs as the caller, from a mounted directory
        run: |
          mkdir work && cd work
          drill() { docker run --rm --user "$(id -u):$(id -g)" -v "$PWD":/work -w /work overwing-drill "$@"; }
          drill help
          drill keygen --out keys
          test -f keys/drill-public.pem
          sed 's/swdr_REPLACE_WITH_DRILL_ID/swdr_AAAAAAAAAAAAAAAAAAAA/' ../sample/scope.example.json > scope.json
          drill sign --scope scope.json --key keys/drill-private.pem
          drill check --scope scope.signed.json
      - name: The image refuses a production process
        run: |
          cd work
          if docker run --rm -e NODE_ENV=production --user "$(id -u):$(id -g)" -v "$PWD":/work -w /work overwing-drill check --scope scope.signed.json; then
            echo "check passed in a production process" >&2; exit 1
          fi
      - name: The sample stack comes up, and the runner can write where it must
        working-directory: sample
        run: |
          export DRILL_USER="$(id -u):$(id -g)"
          docker compose up -d --wait kv
          docker compose run --rm --entrypoint sh drill -c 'touch /data/scratch/probe && touch /scope/probe && node -e "fetch(\"http://kv:8787/healthz\").then(r => process.exit(r.ok ? 0 : 1), () => process.exit(1))"'
          rm -f probe
          docker compose down -v
