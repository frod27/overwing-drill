name: Release image
# A tag v1.2.3 publishes ghcr.io/frod27/overwing-drill:v1.2.3 and :latest. No token is stored: the
# workflow's own token pushes the image.
on:
  push:
    tags: ["v*"]
permissions:
  contents: read
  packages: write
jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: The tag matches package.json
        run: test "v$(node -p 'require("./package.json").version')" = "$GITHUB_REF_NAME"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            ghcr.io/frod27/overwing-drill:${{ github.ref_name }}
            ghcr.io/frod27/overwing-drill:latest
          labels: |
            org.opencontainers.image.source=https://github.com/frod27/overwing-drill
            org.opencontainers.image.description=Runs an Overwing Radar fire drill in your own staging environment
            org.opencontainers.image.licenses=MIT
