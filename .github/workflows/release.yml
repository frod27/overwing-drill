name: Release image
# A tag v1.2.3 publishes ghcr.io/frod27/overwing-drill:v1.2.3 and :latest. No token is stored: the
# workflow's own token pushes the image.
#
# Every action is pinned to a commit, with its version in the comment beside it, so a tag moved
# upstream cannot change what runs here. Dependabot proposes new pins (.github/dependabot.yml).
# Nothing here pushes to the repository, so checkout does not leave its token on disk.
on:
  push:
    tags: ["v*"]
permissions:
  contents: read
jobs:
  # The tag check and the tests run in a job that cannot publish. Only the image job below may write
  # packages, and it runs nothing but what it takes to build, push and sign the image.
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: The tag matches package.json
        run: test "v$(node -p 'require("./package.json").version')" = "$GITHUB_REF_NAME"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - run: npm test

  image:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write       # push the image to ghcr.io
      id-token: write       # sign the provenance as this workflow run, no key stored anywhere
      attestations: write   # record the provenance against this repository
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        id: build
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            ghcr.io/frod27/overwing-drill:${{ github.ref_name }}
            ghcr.io/frod27/overwing-drill:latest
          labels: |
            org.opencontainers.image.source=https://github.com/frod27/overwing-drill
            org.opencontainers.image.description=Runs an Overwing Radar fire drill in your own staging environment
            org.opencontainers.image.licenses=MIT
      # Signed build provenance for the digest both tags point at: which repository, workflow and
      # commit built it. Check an image before running it with:
      #   gh attestation verify oci://ghcr.io/frod27/overwing-drill:v1.2.3 --repo frod27/overwing-drill
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ghcr.io/frod27/overwing-drill
          subject-digest: ${{ steps.build.outputs.digest }}
